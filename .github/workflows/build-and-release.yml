name: Build, Test, Scan and Release

#
# Releases are made by hand from the Actions tab ("Run workflow"), never by pushing a
# tag. That ordering matters: the tag is created by the final "Create GitHub Release"
# step, so it only ever comes into existence for a release that actually passed. A run
# that fails the unit test gate leaves nothing behind to clean up, and the same version
# number can simply be re-run once the fix is pushed.
#
# The version is not typed in here - it is read from InformationalVersion in
# Classic-Repair-Toolbox.csproj, the same property the running app reports (see
# Main/App.axaml.cs). Bumping that property before running this workflow is the only
# place a release version is entered. Pre-release status follows semver: a version
# with a "-" (e.g. "2.5.0-beta.1") is a pre-release, a bare "X.Y.Z" is a full release.
#
on:
  workflow_dispatch:

env:
  PACK_ID: Classic-Repair-Toolbox
  EXE_WINDOWS: Classic-Repair-Toolbox.exe
  EXE_UNIX: Classic-Repair-Toolbox
  PROJECT: Classic-Repair-Toolbox.csproj
  SOLUTION: Classic-Repair-Toolbox.slnx
  TFM_MODERN: net10.0

jobs:
  ###############################################################
  # DETERMINE VERSION
  ###############################################################
  # Reads the release version straight out of the project instead of asking for it by
  # hand - see the comment at the top of this file. Every other job reads it from here
  # rather than re-deriving it, so there is exactly one place this happens.
  determine-version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      is_prerelease: ${{ steps.ver.outputs.is_prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Read version from project
        id: ver
        run: |
          VERSION=$(dotnet msbuild ${{ env.PROJECT }} -getProperty:InformationalVersion -nologo)
          echo "Read version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *"-"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

  ###############################################################
  # BUILD AND UNIT TEST GATE
  ###############################################################
  # Nothing gets published unless the commit being released builds clean and the
  # full test suite passes. This duplicates build-and-unittest.yml on purpose:
  # that one proves main is healthy on every push, while this one proves the
  # exact commit being released is shippable - a release can be started from any
  # branch at any moment, including a commit that never went through that check.
  test:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build (Release)
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      - name: Unit Test
        run: dotnet test ${{ env.SOLUTION }} -c Release --no-build --logger "console;verbosity=normal"

  ###############################################################
  # CODEQL SECURITY SCAN
  ###############################################################
  security-scan:
    name: CodeQL security scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write # Required to upload results to GitHub
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: 'csharp'
          build-mode: autobuild

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"

  ###############################################################
  # WINDOWS BUILD (x64 with self-contained .NET10)
  ###############################################################
  build-windows:
    needs: [test, determine-version]
    name: Build Windows (x64 with self-contained .NET10)
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows (x64)
        shell: powershell
        run: |
          dotnet publish ${{ env.PROJECT }} `
            -c Release `
            -f ${{ env.TFM_MODERN }} `
            -r win-x64 `
            --self-contained `
            -p:Version=${{ needs.determine-version.outputs.version }} `
            -o publish/windows-x64

      - name: Sign executable
        shell: powershell
        env:
          YUBIKEY_PIN: ${{ secrets.YUBIKEY_PIN }}
        run: |
          java -jar C:\tools\jsign-6.0.jar `
            --storetype YUBIKEY `
            --storepass "$env:YUBIKEY_PIN" `
            --tsaurl http://timestamp.digicert.com `
            --alg SHA-256 `
            publish/windows-x64/${{ env.EXE_WINDOWS }}

      - name: Copy data pack
        shell: powershell
        run: |
          Copy-Item -Path "Assets/Data" -Destination "publish/windows-x64" -Recurse

      - name: Install vpk
        shell: powershell
        run: dotnet tool install -g vpk

      - name: Pack with Velopack
        shell: powershell
        run: |
          vpk pack `
            --packId ${{ env.PACK_ID }} `
            --packVersion ${{ needs.determine-version.outputs.version }} `
            --packDir publish/windows-x64 `
            --mainExe ${{ env.EXE_WINDOWS }} `
            --noPortable `
            --icon "Assets/CRT_icon.ico" `
            --packTitle "Classic Repair Toolbox" `
            --outputDir velopack-output

      - name: Sign Velopack installer
        shell: powershell
        env:
          YUBIKEY_PIN: ${{ secrets.YUBIKEY_PIN }}
        run: |
          $installer = Get-ChildItem velopack-output\*-Setup.exe | Select-Object -First 1
          java -jar C:\tools\jsign-6.0.jar `
            --storetype YUBIKEY `
            --storepass "$env:YUBIKEY_PIN" `
            --tsaurl http://timestamp.digicert.com `
            --alg SHA-256 `
            $installer.FullName

      - name: Upload Velopack artifacts
        uses: actions/upload-artifact@v7
        with:
          name: velopack-windows-x64
          path: velopack-output/*

  ###############################################################
  # LINUX BUILD (x64 with self-contained .NET10)
  ###############################################################
  build-linux:
    needs: [test, determine-version]
    name: Build Linux (x64 with self-contained .NET10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish Linux (x64)
        run: |
          dotnet publish ${{ env.PROJECT }} \
            -c Release \
            -f ${{ env.TFM_MODERN }} \
            -r linux-x64 \
            --self-contained \
            -p:Version=${{ needs.determine-version.outputs.version }} \
            -o publish/linux-x64

      - name: Copy data pack
        run: |
          cp -r Assets/Data publish/linux-x64/

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Pack with Velopack
        run: |
          vpk pack \
            --packId ${{ env.PACK_ID }} \
            --packTitle "Classic Repair Toolbox" \
            --packVersion ${{ needs.determine-version.outputs.version }} \
            --packDir publish/linux-x64 \
            --mainExe ${{ env.EXE_UNIX }} \
            --icon "Assets/CRT_icon.png" \
            --outputDir velopack-output

      - name: Upload Velopack artifacts
        uses: actions/upload-artifact@v7
        with:
          name: velopack-linux-x64
          path: velopack-output/*

  ###############################################################
  # MACOS BUILD (arm64 + x64 with self-contained .NET10)
  ###############################################################
  build-macos:
    needs: [test, determine-version]
    name: Build macOS (arm64 + x64 with self-contained .NET10)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish macOS (arm64)
        run: |
          dotnet publish ${{ env.PROJECT }} \
            -c Release \
            -f ${{ env.TFM_MODERN }} \
            -r osx-arm64 \
            --self-contained \
            -p:Version=${{ needs.determine-version.outputs.version }} \
            -o publish/macos-arm64

      - name: Publish macOS (x64)
        run: |
          dotnet publish ${{ env.PROJECT }} \
            -c Release \
            -f ${{ env.TFM_MODERN }} \
            -r osx-x64 \
            --self-contained \
            -p:Version=${{ needs.determine-version.outputs.version }} \
            -o publish/macos-x64

      - name: Copy data pack
        run: |
          cp -r Assets/Data publish/macos-arm64/
          cp -r Assets/Data publish/macos-x64/

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Pack with Velopack (macOS arm64)
        run: |
          vpk pack \
            --packId ${{ env.PACK_ID }} \
            --packTitle "Classic Repair Toolbox" \
            --packVersion ${{ needs.determine-version.outputs.version }} \
            --packDir publish/macos-arm64 \
            --mainExe ${{ env.EXE_UNIX }} \
            --channel osx-arm64 \
            --noPortable \
            --icon "Assets/CRT_icon.icns" \
            --outputDir velopack-output

      - name: Pack with Velopack (macOS x64)
        run: |
          vpk pack \
            --packId ${{ env.PACK_ID }} \
            --packTitle "Classic Repair Toolbox" \
            --packVersion ${{ needs.determine-version.outputs.version }} \
            --packDir publish/macos-x64 \
            --mainExe ${{ env.EXE_UNIX }} \
            --channel osx-x64 \
            --noPortable \
            --icon "Assets/CRT_icon.icns" \
            --outputDir velopack-output

      - name: Upload Velopack artifacts
        uses: actions/upload-artifact@v7
        with:
          name: velopack-macos
          path: velopack-output/*

  ###############################################################
  # CREATE GITHUB RELEASE
  ###############################################################
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [determine-version, build-windows, build-linux, build-macos, security-scan]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download all Velopack artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Set release tag
        id: tag
        run: |
          echo "tag=${{ needs.determine-version.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Determine if Pre-release
        id: prerelease_check
        run: |
          IS_PRE="${{ needs.determine-version.outputs.is_prerelease }}"

          echo "is_prerelease=$IS_PRE" >> $GITHUB_OUTPUT

          if [ "$IS_PRE" = "true" ]; then
            echo "release_name=BETA - ${{ steps.tag.outputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "release_name=${{ steps.tag.outputs.tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Read Changelog and append text
        id: changelog
        run: |
          {
            echo 'content<<EOF'

            if [ -f "CHANGELOG.md" ]; then
              cat CHANGELOG.md
            else
              echo "No CHANGELOG.md found."
            fi

            echo ""

            if [ "${{ steps.prerelease_check.outputs.is_prerelease }}" = "true" ]; then
              echo "This is a **BETA** release, which means there are some functionalities expected not to work perfectly fine. The release is meant as a test, so do not use this if you want the most stable experience."
              echo ""
            fi

            echo "Do note that all versions come with the newest available **.NET 10** embedded (at build time), which means you do not need to install any .NET runtime for this."
            echo ""
            echo "You only need to install the **Classic Repair Toolbox** application once, and thereafter you can update directly from inside the application."

            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.prerelease_check.outputs.release_name }}
          body: |
            ${{ steps.prerelease_check.outputs.is_prerelease == 'true' && 'This is a TEST version, and should not be downloaded/used unless if coordinated with the developer.' || format('{0}

            ### Direct downloads for different platforms
            | Platform | File |
            |----------|------|
            | Windows (x64) | [Classic-Repair-Toolbox-win-Setup.exe](https://github.com/{1}/releases/download/{2}/Classic-Repair-Toolbox-win-Setup.exe) |
            | Linux (x64) | [Classic-Repair-Toolbox.AppImage](https://github.com/{1}/releases/download/{2}/Classic-Repair-Toolbox.AppImage) |
            | macOS Apple Silicon (arm64) | [Classic-Repair-Toolbox-osx-arm64-Setup.pkg](https://github.com/{1}/releases/download/{2}/Classic-Repair-Toolbox-osx-arm64-Setup.pkg) |
            | macOS Intel (x64) | [Classic-Repair-Toolbox-osx-x64-Setup.pkg](https://github.com/{1}/releases/download/{2}/Classic-Repair-Toolbox-osx-x64-Setup.pkg) |', steps.changelog.outputs.content, github.repository, steps.tag.outputs.tag) }}
          draft: false
          prerelease: ${{ steps.prerelease_check.outputs.is_prerelease == 'true' }}
          files: |
            release-assets/*-Setup.exe
            release-assets/*.AppImage
            release-assets/*-Setup.pkg
            release-assets/*.nupkg
            release-assets/releases.*.json
            release-assets/assets.*.json

      - name: Delete old pre-releases
        if: ${{ steps.prerelease_check.outputs.is_prerelease == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "Fetching all pre-releases..."
          gh release list \
            --repo ${{ github.repository }} \
            --limit 100 \
            --json tagName,isPrerelease \
            | jq -r '.[] | select(.isPrerelease == true) | .tagName' \
            | while read tag; do
                if [ "$tag" != "$CURRENT_TAG" ]; then
                  echo "Deleting pre-release: $tag"
                  gh release delete "$tag" \
                    --repo ${{ github.repository }} \
                    --yes \
                    --cleanup-tag
                else
                  echo "Keeping current pre-release: $tag"
                fi
              done
