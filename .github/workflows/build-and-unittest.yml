name: Build and Unit Test

#
# Fast health check on every push and pull request: builds Release and runs the
# full test suite on a clean machine.
#
# Deliberately kept separate from the release workflow (build-and-release.yml).
# This one must stay cheap, fast and free of side effects so it can run on
# everything; that one signs binaries with the YubiKey and publishes a public
# release, so it stays on tags only. The release workflow runs its own copy of
# these steps as a gate, because a tag can point at any commit.
#
# Note: a "branches" filter means tag pushes do NOT trigger this - the release
# workflow handles those.
#

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

#
# Only ever keep the newest run per branch alive. Pushing several commits in a row
# would otherwise leave a queue of runs all testing superseded code; the older ones
# are cancelled the moment a newer push arrives. Cancelled runs show up grey in the
# Actions tab, which is not a failure - it just means a newer commit took over.
#
# Grouped per branch, so work on one branch never cancels another branch's run.
#
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION: Classic-Repair-Toolbox.slnx

jobs:
  ###############################################################
  # BUILD AND TEST
  ###############################################################
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build (Release)
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      - name: Test
        run: >
          dotnet test ${{ env.SOLUTION }} -c Release --no-build
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ${{ github.workspace }}/TestResults

      #
      # Coverage is REPORTED, not enforced. There is deliberately no threshold that fails the
      # build: a floor set while the suite is still growing either blocks unrelated work or is set
      # so low it means nothing. Making it a gate is a separate, deliberate decision.
      #
      # It exists because a percentage written into a document goes stale silently and is then
      # quoted as fact - which is exactly what happened here once already. A figure the pipeline
      # recomputes on every push cannot. This is also why no number is committed to CLAUDE.md.
      #
      # "always()" so the figures still appear when the suite is red: a run that fails a test is
      # precisely when knowing what was and was not exercised is useful.
      #
      - name: Coverage summary
        if: always()
        run: |
          # "|| true" and the redirect matter: run: blocks run under "bash -e", so a missing
          # TestResults folder (dotnet test crashed before writing anything) would make find exit
          # non-zero and fail THIS step - masking the real failure with a second red one, which is
          # the exact case the always() above exists to report on. The script already handles an
          # empty or missing path by skipping.
          REPORT=$(find "${{ github.workspace }}/TestResults" -name 'coverage.cobertura.xml' 2>/dev/null | head -1 || true)
          bash .github/workflows/coverage-summary.sh "$REPORT"

      #
      # The raw Cobertura XML, kept so a specific run's per-file numbers can be inspected later
      # (the job summary only carries the totals). Short retention: this is a health check that
      # runs on every push, and the report is only interesting while the run is recent.
      #
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ github.workspace }}/TestResults/**/coverage.cobertura.xml
          retention-days: 7
          if-no-files-found: ignore
